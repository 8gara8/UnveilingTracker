# Source registry (SPEC §4.13). Drafted in Foundation from the spec's table and finalised in P2 from Kobol's live
# reads: batch K1c read every URL below on 2026-11-28 (12:46 to 13:30 Taipei, 04:46 to 05:30 UTC) and batch K1a
# read OpenAlex's (docs/reports/p2-kobol/K1c-feeds.md and K1a-openalex.md). Each `url` answered 200, except
# `lab-microsoft-ai-for-science`'s, which K1c named as the live feed without reading its items. Each `fresh_days`
# is the longest normal gap between items, rounded up, plus a day (a feed that shows too few items has its
# publishing cadence, rounded the same way); the one that is a guess is that same feed's 14, and a later
# `sources:check` on Kobol may move any of them.
#
# Every key is explicit on every feed:
#   id            unique; also the file name of the feed's saved fixture
#   name          what the feed is, as the sources:check table prints it
#   kind          api | rss | page | file
#   url           where the feed is read; for an api, the endpoint the parser builds its query on
#   fallback_url  read when url fails, or null; counted in `budget`, so a feed with one has a budget of at least 2
#   priority      1: the morning needs it (a problem fails sources:check); 2: wanted; 3: counters and extras (a
#                 journal's feed is 2 when the journal counts in the Pace, else 3; Nature and Science keep the 1
#                 the Foundation drafted)
#   fresh_days    the feed is stale when its newest item is more than this many days old (judged at the pack
#                 window's end by collect, at the clock by sources:check; an item dated after the run's date is
#                 ignored); null for a feed with no dated items to judge (counts, figures, records looked up by
#                 id, and the two lab pages that print no dates)
#   must_match    true: an item enters the pack only if its title or abstract matches config/ai-terms.json
#   date_zone     the UTC offset (+08:00) of the feed's times written without a zone when the feed names
#                 none, or null, which reads them as UTC (K1c: every feed names its zone or gives a bare
#                 calendar day that no publisher dates in Taipei time; Sakana AI's +09:00 is the one set)
#   fields        the fields (SPEC §4.2 FIELDS) its items belong to; [] when each item is mapped on its own
#                 (OpenAlex topic, journal or arXiv category, SPEC §8.3)
#   parser        atom | json | rss | html | csv | none (none: never read by collect)
#   budget        the most requests the feed may make in one morning
#
# Journals without a feed here: JACS and Environmental Science & Technology (pubs.acs.org answers every plain GET
# with a Cloudflare challenge; no workaround is tried), Acta Mathematica and the Journal of Biblical Literature
# (they publish no feed). `crossref-journals` carries all four with the rest of config/journals.json.
#
# Not settled yet: the Sunday and Monday arXiv announcements against arxiv.org/list/<cat>/new (a P3 dry run on a
# Tuesday and a Wednesday), `arxiv-physics`'s `hep*`, `nucl*` and `gr-qc` and `arxiv-stat-ml`'s queries (K1c read
# `math*` and `physics*` only), the cadence of `lab-microsoft-ai-for-science`'s site-wide feed (K1c read only the
# lab's own stale feed), the length of EurekAlert!'s daily summaries view, and how collect drops the news and
# corrections that `crossref-journals` returns beside the papers.
#
# arxiv_skipped: the US dates of the arXiv announcements that arXiv skips for holidays (a Friday holiday skips the
# Sunday announcement after it); each announcement's list runs from the deadline of the previous announcement not
# listed (SPEC §4.13). Seeded in P2 from arXiv's availability page (A) and its blog notice of 2026-11-25 (B),
# K1c's list: the eight dates of 2026 that are past, kept for the tests, then the eleven of the next twelve
# months. A PR adds each later notice from those two pages and raises the `arxiv-<cat>` feeds' `fresh_days` if a
# skip lengthens the longest gap, 3.76 days at most so far (SPEC §4.13, §10 P2 step 1).
#   A = https://info.arxiv.org/help/availability.html
#   B = https://blog.arxiv.org/2026/11/25/holiday-announcement-schedule/
schema_version: 1
arxiv_skipped:
  - "2026-01-01"  # A: New Year's Day (Thursday)
  - "2026-01-19"  # A: Martin Luther King Jr. Day
  - "2026-06-21"  # A: Juneteenth observed on Friday 2026-06-19 skips the Sunday announcement
  - "2026-07-05"  # A: Independence Day observed on Friday 2026-07-03 skips the Sunday announcement
  - "2026-09-07"  # A: Labor Day
  - "2026-10-12"  # A: Columbus Day
  - "2026-11-11"  # A: Veterans Day
  - "2026-11-26"  # A and B: Thanksgiving; its submissions go out on Sunday 2026-11-29
  - "2026-12-27"  # B: Christmas on Friday 2026-12-25 skips the Sunday announcement; the list goes out Monday 2026-12-28
  - "2027-01-03"  # B: New Year's Day on Friday 2027-01-01 skips the Sunday announcement; the list goes out Monday 2027-01-04
  - "2027-01-18"  # A: Martin Luther King Jr. Day
  - "2027-02-15"  # A: Presidents' Day
  - "2027-05-31"  # A: Memorial Day
  - "2027-06-20"  # A: Juneteenth observed on Friday 2027-06-18 skips the Sunday announcement
  - "2027-07-05"  # A: Independence Day observed
  - "2027-09-06"  # A: Labor Day
  - "2027-10-11"  # A: Columbus Day
  - "2027-11-11"  # A: Veterans Day
  - "2027-11-25"  # A: Thanksgiving
