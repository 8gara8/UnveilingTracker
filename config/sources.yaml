# Source registry (SPEC §4.13). Drafted in Foundation from the spec's table; P2 finalises it on Kobol with
# `npm run sources:check`, which reads every URL. Until then every URL here is "Verify in P2": the cloud
# container that drafted it cannot reach these hosts (SPEC Appendix C).
#
# Every key is explicit on every feed:
#   id            unique; also the file name of the feed's saved fixture
#   name          what the feed is, as the sources:check table prints it
#   kind          api | rss | page | file
#   url           where the feed is read; for an api, the endpoint the parser builds its query on
#   fallback_url  read when url fails, or null
#   priority      1: the morning needs it (a problem fails sources:check); 2: wanted; 3: counters and extras
#   must_match    true: an item enters the pack only if its title or abstract matches config/ai-terms.json
#   fields        the fields (SPEC §4.2 FIELDS) its items belong to; [] when each item is mapped on its own
#                 (OpenAlex topic, journal or arXiv category, SPEC §8.3)
#   parser        atom | json | rss | html | csv | none (none: read only by the Chinese pass, never by collect)
#   budget        the most requests the feed may make in one morning
schema_version: 1
feeds:
  # ── Preprint servers and indexes ──────────────────────────────────────────────────────────────
  - id: arxiv-math
    name: arXiv API, mathematics (the previous announcement day)
    kind: api
    url: https://export.arxiv.org/api/query
    fallback_url: null
    priority: 1
    must_match: true
    fields: [mathematics]
    parser: atom
    budget: 2
  - id: arxiv-physics
    name: arXiv API, physics
    kind: api
    url: https://export.arxiv.org/api/query
    fallback_url: null
    priority: 1
